 <!DOCTYPE html>
<html>
<head>
 <title>Student Registration</title>
</head>
<body>
 <center>
 <h2>Student Registration Form</h2>
 <form>
 
   <!--Textboxes-->
   <label> Fullname: </label><br>
   <input type="text" name="fullname"><br><br>
   
   <label>Email:</label><br>
   <input type="email" name="email"><br><br>
   
   <label>  Password  :</label> <br>
   <input type="password" name="password"><br><br>
   
   <label>  Phone Number  :</label> <br>
   <input type="tel" name="phone"><br><br>
   
   <!--Radio Buttons-->
   <label>Gender:</label><br>
   <input type="radio" name="gender" value="Female">Female
   <input type="radio" name="gender" value="Male">Male
   <input type="radio" name="gender" value="Other">Other
   
   <!--Date-->
   <label>Date of Brith:</label><br>
   <input type="date" name="dob"><br><br>

   <!Combo Box-->
   <label>Department:</label><br>
   <select name="department">
     <option>BIS</option>
	 <option>IB</option>
	 <option>HMT</option>
	 <option>LSCM</option>
   </select>
   <br><br>
   
   <!--Checkboxes-->
   <label>Skills:</label><br>
   <input type="checkbox" name="skills" value="HTML">HTML
   <input type="checkbox" name="skills" value="Accounting">Accounting
   <input type="checkbox" name="skills" value="Finance">Finance
   <input type="checkbox" name="skills" value="Date Science">Date Secience
   <br><br>
   
   <!--Text Area-->
   <label>Address:</label><br>
   <textarea name="address" rows="4" cols"30"> </textarea>
   <br> <br>
   
    <!--Button-->
	<input type="submit" value="Register">
	<input type="reset" value="Clear">
	
 </form>
 </center>
</body>
</html>
